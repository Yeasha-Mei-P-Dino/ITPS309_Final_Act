{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Auth{% endblock %}</title>

  <!-- Inria Serif (Bold & Regular) + Inria Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:ital,wght@0,400;0,700;1,400&family=Inria+Serif:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary-green: #708D5F;
      --accent-sage: #BFC693;
      --dark-forest: #3C4B34;
      --input-light: #EEECED;
      --pure-black: #000000;
      --pure-white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Inria Sans", sans-serif;
      background-color: var(--dark-forest);
      background-image: url("{% static 'images/image5.jpg' %}");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: scroll;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      height: 76px;
      width: 100%;
      background: linear-gradient(90deg, var(--primary-green) 0%, var(--accent-sage) 100%);
      flex-shrink: 0;
    }

    .page-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background-color: var(--primary-green);
      border: 1.5px solid rgba(238, 236, 237, 0.85);
      border-radius: 14px;
      padding: 36px 42px 32px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      color: var(--pure-white);
    }

    .auth-card h1 {
      font-family: "Inria Serif", serif;
      font-weight: 700;
      text-align: center;
      font-size: 2.35rem;
      margin-bottom: 24px;
      letter-spacing: 0.3px;
      color: var(--pure-white);
    }

    .input-box {
      position: relative;
      display: flex;
      align-items: center;
      background-color: var(--input-light);
      border: 2px solid var(--dark-forest);
      border-radius: 7px;
      height: 44px;
      margin-bottom: 12px;
      padding: 0 12px;
    }

    .input-box .icon-left {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--dark-forest);
      margin-right: 10px;
      flex-shrink: 0;
    }

    .input-box input {
      flex: 1;
      border: none;
      background: transparent;
      font-family: "Inria Serif", serif;
      font-weight: 400;
      font-size: 1rem;
      color: var(--pure-black);
      outline: none;
      min-width: 0;
    }

    .input-box input::placeholder {
      color: var(--dark-forest);
      opacity: 0.72;
    }

    .toggle-eye {
      position: relative;
      width: 28px;
      height: 28px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--dark-forest);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin-left: 6px;
      flex-shrink: 0;
    }

    .toggle-eye svg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .toggle-eye .eye-closed {
      display: block !important;
    }

    .toggle-eye .eye-open {
      display: none !important;
    }

    .toggle-eye.is-open .eye-closed {
      display: none !important;
    }

    .toggle-eye.is-open .eye-open {
      display: block !important;
    }

    .underline-group {
      position: relative;
      display: flex;
      align-items: center;
      border-bottom: 1.5px solid var(--dark-forest);
      padding: 8px 4px;
      margin-bottom: 18px;
    }

    .underline-group .toggle-eye {
      color: var(--pure-white);
    }

    .underline-group .icon-left {
      color: var(--pure-white);
      margin-right: 12px;
      display: inline-flex;
      align-items: center;
    }

    .underline-group input {
      flex: 1;
      border: none;
      background: transparent;
      font-family: "Inria Serif", serif;
      font-weight: 400;
      font-size: 1.05rem;
      color: var(--pure-white);
      outline: none;
      min-width: 0;
    }

    .underline-group input::placeholder {
      color: var(--input-light);
      opacity: 0.9;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: "Inria Sans", sans-serif;
      font-size: 0.85rem;
      color: var(--input-light);
      margin: 10px 0 16px;
    }

    .checkbox-row input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border: 1.5px solid var(--input-light);
      border-radius: 5px;
      background: transparent;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }

    .checkbox-row input[type="checkbox"]:checked {
      background-color: var(--accent-sage);
      border-color: var(--pure-white);
    }

    .checkbox-row input[type="checkbox"]:checked::after {
      content: "✓";
      position: absolute;
      color: var(--pure-black);
      font-size: 14px;
      font-weight: 700;
      top: 1px;
      left: 5px;
    }

    .checkbox-row a {
      color: var(--pure-white);
      text-decoration: underline;
    }

    .login-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: "Inria Sans", sans-serif;
      font-size: 0.85rem;
      margin: 6px 0 22px;
    }

    .login-options .checkbox-row {
      margin: 0;
      gap: 8px;
    }

    .login-options .checkbox-row input[type="checkbox"] {
      width: 19px;
      height: 19px;
    }

    .login-options a {
      color: var(--input-light);
      text-decoration: none;
    }

    .login-options a:hover {
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      height: 46px;
      background-color: var(--accent-sage);
      color: var(--pure-black);
      border: 1px solid var(--dark-forest);
      border-radius: 8px;
      font-family: "Inria Serif", serif;
      font-weight: 400;
      font-size: 1.25rem;
      cursor: pointer;
      transition: filter 0.15s ease;
    }

    .btn-submit:hover {
      filter: brightness(1.04);
    }

    .helper-note {
      font-family: "Inria Sans", sans-serif;
      text-align: center;
      font-size: 0.84rem;
      color: var(--input-light);
      margin-top: 10px;
      line-height: 1.35;
    }

    .error-list {
      font-family: "Inria Sans", sans-serif;
      list-style: none;
      margin: 10px 0 4px;
      padding: 0;
      text-align: center;
      font-size: 0.85rem;
      color: var(--pure-white);
      font-weight: 700;
    }

    .bottom-switch {
      font-family: "Inria Sans", sans-serif;
      text-align: center;
      margin-top: 18px;
      font-size: 0.88rem;
      color: var(--input-light);
    }

    .bottom-switch a {
      color: var(--pure-white);
      text-decoration: underline;
    }

    /* Tablet view */
    @media (max-width: 768px) {
      .top-bar {
        height: 60px;
      }

      .page-wrapper {
        padding: 24px 16px;
      }

      .auth-card {
        max-width: 420px;
        padding: 32px 28px 28px;
      }

      .auth-card h1 {
        font-size: 2.1rem;
        margin-bottom: 20px;
      }
    }

    /* Mobile view */
    @media (max-width: 480px) {
      .top-bar {
        height: 48px;
      }

      .page-wrapper {
        padding: 16px 12px;
      }

      .auth-card {
        padding: 24px 18px 22px;
        border-radius: 12px;
      }

      .auth-card h1 {
        font-size: 1.8rem;
        margin-bottom: 18px;
      }

      .input-box {
        height: 46px;
        padding: 0 10px;
      }

      .input-box input,
      .underline-group input {
        font-size: 16px;
      }

      .btn-submit {
        height: 46px;
        font-size: 1.15rem;
      }

      .login-options {
        flex-wrap: wrap;
        gap: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="top-bar"></div>
  <main class="page-wrapper">
    {% block content %}{% endblock %}
  </main>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll(".toggle-eye").forEach((btn) => {
        btn.addEventListener("click", () => {
          const input = document.getElementById(btn.dataset.target);
          if (!input) return;
          const isVisible = input.type === "password";
          input.type = isVisible ? "text" : "password";
          btn.classList.toggle("is-open", isVisible);
          btn.setAttribute("aria-pressed", String(isVisible));
        });
      });
    });
  </script>
</body>
</html>
